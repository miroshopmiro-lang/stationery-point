<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png" />
    <link rel="apple-touch-icon" href="/favicon-128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#332E92" />

    <!-- Primary SEO -->
    <title>Stationery Point – Stationery &amp; Art Supplies Store in Kochi</title>
    <meta name="description" content="Stationery Point is a stationery and art supplies store in Kochi. Notebooks, pens, art materials, office supplies and more — all priced below MRP. Enquire on WhatsApp." />
    <meta name="keywords" content="stationery shop kochi, art supplies kochi, notebooks below MRP, pens kochi, office supplies kochi, stationery point" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://stationery-point.pages.dev/" />

    <!-- LocalBusiness structured data: ties the site to the Google Business Profile -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "Stationery Point",
      "description": "Stationery, office, school, art and craft supplies below MRP in Vyttila, Kochi.",
      "image": "https://stationery-point.pages.dev/storefront.jpg",
      "url": "https://stationery-point.pages.dev/",
      "telephone": "+918848838132",
      "priceRange": "₹",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Ground Floor, Katti Tower, Jr Janatha Rd, Janatha Junction, Vyttila",
        "addressLocality": "Kochi",
        "addressRegion": "Kerala",
        "postalCode": "682019",
        "addressCountry": "IN"
      },
      "geo": { "@type": "GeoCoordinates", "latitude": 9.96825, "longitude": 76.31200 },
      "openingHoursSpecification": [{
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
        "opens": "09:30",
        "closes": "20:00"
      }],
      "sameAs": ["https://www.instagram.com/stationerypoint._"]
    }
    </script>

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stationery Point" />
    <meta property="og:title" content="Stationery Point – Stationery &amp; Art Supplies Store in Kochi" />
    <meta property="og:description" content="Notebooks, pens, art materials, office supplies and more — all priced below MRP. Visit us in Kochi or enquire on WhatsApp." />
    <meta property="og:image" content="https://stationery-point.pages.dev/storefront.jpg" />
    <!-- These must match the file. storefront.jpg is 1024x576; the declared
         1200x630 was a guess and scrapers that trust it render a broken crop. -->
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="576" />
    <meta property="og:image:alt" content="The Stationery Point shopfront in Vyttila, Kochi" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stationery Point – Stationery &amp; Art Supplies Store in Kochi" />
    <meta name="twitter:description" content="Notebooks, pens, art materials, office supplies and more — all priced below MRP. Enquire on WhatsApp." />
    <meta name="twitter:image" content="https://stationery-point.pages.dev/storefront.jpg" />

    <!-- Fonts (NOOE Font Pair: DM Sans + Playfair Display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Playfair+Display:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
