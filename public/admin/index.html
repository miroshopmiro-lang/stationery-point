<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Stationery Point — Admin</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Light-touch branding only — deliberately no deep selector overrides so
         CMS updates can never break the admin UI. */
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif !important;
      }
      /* Brand accent bar across the top of the panel */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        z-index: 9999;
        background: linear-gradient(90deg, #241f6b, #332e92 40%, #ffb000);
        pointer-events: none;
      }
      ::selection {
        background: #332e92;
        color: #fff;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #c7c9e8 transparent;
      }
    </style>
  </head>
  <body>
    <!-- Version pinned exactly (no ^ range) so a compromised future release
         can never be pulled in silently. Bump deliberately after review. -->
    <script src="https://unpkg.com/decap-cms@3.8.4/dist/decap-cms.js"></script>
  </body>
</html>
