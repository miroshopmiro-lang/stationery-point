# Decap CMS configuration for Stationery Point.
# Edit products/categories at /admin — every save commits to GitHub and
# Cloudflare Pages redeploys the site automatically.

backend:
  name: github
  repo: miroshopmiro-lang/stationery-point
  branch: master
  # OAuth proxy worker — deploy cms-oauth-worker/ and put its URL here.
  # See docs/cms-setup.md for the one-time setup steps.
  base_url: https://REPLACE-WITH-YOUR-WORKER-URL.workers.dev

# Lets `npx decap-server` serve /admin against the local repo during development.
local_backend: true

site_url: https://stationery-point.pages.dev
logo_url: /logo.webp
media_folder: public/shop-catalogue-images
public_folder: /shop-catalogue-images

collections:
  - name: products
    label: Products
    label_singular: Product
    folder: src/data/products
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: name
    summary: '{{name}} ({{category}})'
    sortable_fields: [name, category]
    view_filters:
      - { label: New Arrivals, field: newArrival, pattern: true }
      - { label: Out of Stock, field: inStock, pattern: false }
    fields:
      - { name: name, label: Product Name, widget: string }
      - name: category
        label: Category
        widget: select
        options:
          - { label: Stationery, value: stationery }
          - { label: Office Supplies, value: office-supplies }
          - { label: Art Supplies, value: art-supplies }
          - { label: Craft Material, value: craft-material }
          - { label: 'Party & Gifts', value: party-gifts }
          - { label: 'Return Gifts', value: return-gifts }
          - { label: 'Special Edition', value: special-edition }
      - { name: brand, label: Brand, widget: string, required: false, default: '', hint: 'e.g. Classmate, Camlin, Faber-Castell — shown on the card' }
      - { name: mrp, label: 'MRP (₹)', widget: number, required: false, value_type: float, hint: 'Fill MRP + Our Price to show the strike-through price on the card' }
      - { name: ourPrice, label: 'Our Price (₹)', widget: number, required: false, value_type: float }
      - { name: price, label: Price text, widget: string, default: 'Below MRP', hint: 'Shown when MRP/Our Price are empty' }
      - { name: image, label: Photo, widget: image, required: false, default: '', hint: 'Plain background photos look best in the grid' }
      - { name: inStock, label: In Stock, widget: boolean, default: true }
      - { name: newArrival, label: Show in New Arrivals, widget: boolean, default: false }
      - { name: description, label: Description, widget: text, required: false, default: '' }
      - { name: tags, label: Search Tags, widget: list, required: false, default: [] }
      - { name: unit, label: Unit, widget: string, required: false, hint: 'NOS, PACK, etc. Leave as is' }
      - { name: sourceDescription, label: 'Original list name', widget: hidden, required: false }
      - { name: brandSource, label: 'Brand source', widget: hidden, required: false }
      - { name: id, label: Internal ID, widget: number, required: false, hint: 'Leave empty for new products' }

  - name: settings
    label: Site Settings
    files:
      - name: categories
        label: Categories
        file: src/data/categories.json
        fields:
          - name: items
            label: Categories
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: id, label: 'ID (lowercase-with-dashes, used in links)', widget: string }
              - { name: title, label: Title, widget: string }
              - { name: image, label: 'Category photo (browse cards)', widget: image, required: false, default: '' }
